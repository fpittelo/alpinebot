name: Deploy Full Environment (Orchestrator)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - qa
          - main
      deploy_backend:
        description: "Deploy backend storage (usually only needed on first deployment)"
        required: false
        type: boolean
        default: false
      deploy_infra:
        description: "Deploy infrastructure (Terraform)"
        required: false
        type: boolean
        default: true
      deploy_function:
        description: "Deploy Function App (Backend)"
        required: false
        type: boolean
        default: true
      deploy_app:
        description: "Deploy application (Frontend)"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  backend:
    name: Create Backend Storage
    if: ${{ github.event.inputs.deploy_backend == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment
        id: setenv
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false
          enable-AzPSSession: false

      - name: Set Azure Subscription
        run: |
          echo "Setting Azure Subscription to: ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create backend resources
        run: |
          # Define variables for the backend resources
          az_backend_rg_name="${{ env.ENVIRONMENT }}-bkd-alpinebot"
          az_backend_sa_name="${{ env.ENVIRONMENT }}bkdalpinebotsa"
          az_backend_container_name="${{ env.ENVIRONMENT }}-bkd-alpinebot-co"
          az_location="SwitzerlandNorth"

          # Re-set subscription context before resource group creation as an additional safeguard
          echo "Setting Azure Subscription to: ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

          # Create resource group if it doesn't exist
          az group create --name $az_backend_rg_name --location $az_location

          # Create storage account if it doesn't exist
          az storage account create \
            --name $az_backend_sa_name \
            --resource-group $az_backend_rg_name \
            --location $az_location \
            --sku Standard_LRS

          # Adding a small delay to ensure the storage account is fully provisioned
          sleep 30

          # Get the storage account key
          STORAGE_KEY=$(az storage account keys list --resource-group $az_backend_rg_name --account-name $az_backend_sa_name --query '[0].value' -o tsv)

          # Create storage container if it doesn't exist
          az storage container create \
            --name $az_backend_container_name \
            --account-name $az_backend_sa_name \
            --account-key $STORAGE_KEY

      - name: Output backend information
        run: |
          echo "Backend storage created successfully:"
          echo "  Resource Group: ${{ env.ENVIRONMENT }}-bkd-alpinebot"
          echo "  Storage Account: ${{ env.ENVIRONMENT }}bkdalpinebotsa"
          echo "  Container: ${{ env.ENVIRONMENT }}-bkd-alpinebot-co"

  deploy-infra:
    name: Deploy Infrastructure
    if: ${{ always() && github.event.inputs.deploy_infra == 'true' && (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    needs: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment
        id: setenv
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT

      - name: Login To Azure Using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false
          enable-AzPSSession: false

      - name: Set Terraform Environment Variables
        run: |
          echo "TF_VAR_az_client_id=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_az_tenant_id=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_az_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_az_container_name=${{ env.ENVIRONMENT }}-bkd-alpinebot-co" >> $GITHUB_ENV
          echo "TF_VAR_sp_object_id=${{ secrets.AZURE_SP_OBJECT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_az_openai_key_value=${{ secrets.AZURE_OPENAI_KEY }}" >> $GITHUB_ENV
          echo "TF_VAR_postgresql_admin_password=${{ secrets.POSTGRESQL_ADMIN_PASSWORD }}" >> $GITHUB_ENV
          echo "TF_VAR_postgresql_admin_username=${{ secrets.POSTGRESQL_ADMIN_USERNAME }}" >> $GITHUB_ENV
          echo "TF_VAR_google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> $GITHUB_ENV

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.ENVIRONMENT }}-bkd-alpinebot" \
            -backend-config="storage_account_name=${{ env.ENVIRONMENT }}bkdalpinebotsa" \
            -backend-config="container_name=${{ env.ENVIRONMENT }}-bkd-alpinebot-co" \
            -backend-config="key=${{ env.ENVIRONMENT }}-bkd-alpinebot.tfstate"
        working-directory: ./infra

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: true
          TF_LOG: DEBUG
          TF_LOG_PATH: terraform.log
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          echo "Using environment: ${{ env.ENVIRONMENT }}"
          terraform apply -var="environment=${{ env.ENVIRONMENT }}" -auto-approve
        working-directory: ./infra

      - name: Upload Terraform Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-log-${{ env.ENVIRONMENT }}
          path: ./infra/terraform.log
          overwrite: true

      - name: Output infrastructure information
        run: |
          echo "Infrastructure deployment completed for environment: ${{ env.ENVIRONMENT }}"

  deploy-function:
    name: Deploy Function App
    if: ${{ always() && github.event.inputs.deploy_function == 'true' && (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    needs: deploy-infra
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment
        id: setenv
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT

      - name: Login To Azure Using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false
          enable-AzPSSession: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.ENVIRONMENT }}-alpinebot-func
          package: ./backend
          scm-do-build-during-deployment: "true"
          enable-oryx-build: "true"

      - name: Output deployment information
        run: |
          echo "Function App deployed successfully to: ${{ env.ENVIRONMENT }}-alpinebot-func"
          echo "Function URL: https://${{ env.ENVIRONMENT }}-alpinebot-func.azurewebsites.net"

  deploy-app:
    name: Deploy Application
    if: ${{ always() && github.event.inputs.deploy_app == 'true' && (needs.deploy-function.result == 'success' || needs.deploy-function.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    needs: deploy-function
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment
        id: setenv
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT

      - name: Login To Azure Using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false
          enable-AzPSSession: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/app/package.json

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./frontend/app

      - name: Build Frontend Application
        run: npm run build
        working-directory: ./frontend/app
        env:
          REACT_APP_FUNCTION_APP_URL: https://${{ env.ENVIRONMENT }}-alpinebot-func.azurewebsites.net

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.ENVIRONMENT }}-alpinebot-as
          package: ./frontend/app/build

      - name: Output deployment information
        run: |
          echo "Frontend application deployed successfully to: ${{ env.ENVIRONMENT }}-alpinebot-as"
